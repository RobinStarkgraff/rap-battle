# Runs the same checks as the dev container: `make check`, `make build` and `make test-e2e`.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Same major version as the dev container.
          node-version: 20
          cache: npm
      - run: make install
      - run: make check
      - run: make build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: make install
      # CI has open network access, so it downloads the browser that matches the pinned version.
      - run: npx playwright install --with-deps chromium
      - run: make test-e2e
        env:
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
